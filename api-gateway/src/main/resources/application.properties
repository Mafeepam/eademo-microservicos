server.port=8080

spring.application.name=api-gateway

# Configurações do Spring Cloud Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=false

# Rotas Explícitas para USUARIOS-SERVICE
spring.cloud.gateway.routes[0].id=login-route
spring.cloud.gateway.routes[0].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/login

spring.cloud.gateway.routes[1].id=usuarios-route
spring.cloud.gateway.routes[1].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[2].id=perfil-route
spring.cloud.gateway.routes[2].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/perfil/**

# --- ADICIONAR ROTAS PARA ESPACOS-SERVICE ABAIXO ---

# Rota para /api/v1/espacos/** -> direciona para /api/v1/espacos/** no ESPACOS-SERVICE
spring.cloud.gateway.routes[3].id=espacos-service-v1-route
spring.cloud.gateway.routes[3].uri=lb://ESPACOS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/espacos/**


# Configurações do Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# eureka.instance.hostname=localhost

