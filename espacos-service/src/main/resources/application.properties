# Nome da aplicação
spring.application.name=espacos-service
server.port=8081

# Configuração do DataSource
# Substitua 'nome_do_seu_banco_de_dados' pelo nome do banco de dados onde você criou os schemas.
# Se o seu banco de dados se chama 'scea', use 'scea'. Se for o padrão 'postgres', use 'postgres'.
spring.datasource.url=jdbc:postgresql://localhost:5432/scea
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate # 'validate' é bom para verificar se a tabela corresponde à entidade
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O schema 'espacos_schema' é definido na anotação @Table da entidade

# Cliente Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true