# Nome da aplicação (registrado no Eureka)
spring.application.name=reservas-service

# Porta do servidor (use uma porta diferente dos outros microsserviços)
server.port=8082

# Configuração do DataSource (PostgreSQL)
# Substitua 'nome_do_seu_banco_de_dados', 'seu_usuario' e 'sua_senha' pelos seus dados reais.
# Lembre-se que o schema 'reservas_schema' será usado para as tabelas deste serviço.
spring.datasource.url=jdbc:postgresql://localhost:5432/scea
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA/Hibernate
# O schema 'reservas_schema' é definido na anotação @Table da entidade Reserva.java.
# Se preferir, pode definir um schema padrão para todas as entidades deste serviço aqui:
# spring.jpa.properties.hibernate.default_schema=reservas_schema
spring.jpa.hibernate.ddl-auto=validate # Use 'validate' para checar se o schema do BD corresponde à entidade. 'update' em desenvolvimento.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Cliente Eureka
# Ajuste se o seu Eureka Server estiver em um endereço/porta diferente.
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configurações opcionais para Feign (para comunicação entre serviços)
# feign.client.config.default.connectTimeout=5000
# feign.client.config.default.readTimeout=5000
# feign.circuitbreaker.enabled=true # Para habilitar Circuit Breaker com Feign (requer dependência adicional como Resilience4J)